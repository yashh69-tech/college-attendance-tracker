<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunk & Attendance Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #030712);
      min-height: 100vh;
      color: #f8fafc;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signOut, 
      onAuthStateChanged,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWtqbPuubybClu6KL_GxFhSE24TK3Cp94",
      authDomain: "college-attendance-track-2b94f.firebaseapp.com",
      projectId: "college-attendance-track-2b94f",
      storageBucket: "college-attendance-track-2b94f.appspot.com",
      messagingSenderId: "507456065132",
      appId: "1:507456065132:web:9907f4b9f6d978154c5249"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let subjects = [];

    window.switchAuthMode = (mode) => {
      const isLogin = mode === 'login';
      document.getElementById('auth-submit-btn').innerText = isLogin ? 'Login' : 'Sign Up';
      document.getElementById('toggle-to-signup').classList.toggle('hidden', !isLogin);
      document.getElementById('toggle-to-login').classList.toggle('hidden', isLogin);
      document.getElementById('auth-error').innerText = '';
    };

    window.handleAuth = async () => {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value;
      const isLogin = document.getElementById('auth-submit-btn').innerText === 'Login';
      const errEl = document.getElementById('auth-error');
      errEl.innerText = '';

      if (!email || !password) {
        errEl.innerText = "Email & Password enter karo bhai!";
        return;
      }

      try {
        if (isLogin) {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
        }
      } catch (err) {
        errEl.innerText = err.message.replace("Firebase: ", "");
      }
    };

    window.handleResetPassword = async () => {
      const email = document.getElementById('auth-email').value.trim();
      const errEl = document.getElementById('auth-error');
      if (!email) {
        errEl.innerText = "Pehle email box me apna Gmail daalo!";
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        alert("Password reset link bhej di hai Gmail par check karo!");
      } catch (err) {
        errEl.innerText = err.message.replace("Firebase: ", "");
      }
    };

    window.handleLogout = async () => {
      await signOut(auth);
      subjects = [];
      renderSubjects();
    };

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      const authCard = document.getElementById('auth-section');
      const appCard = document.getElementById('app-section');
      const userBadge = document.getElementById('user-badge');

      if (user) {
        authCard.classList.add('hidden');
        appCard.classList.remove('hidden');
        userBadge.innerText = user.email;
        loadUserData(user.uid);
      } else {
        authCard.classList.remove('hidden');
        appCard.classList.add('hidden');
      }
    });

    async function loadUserData(uid) {
      try {
        const docRef = doc(db, "users", uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          subjects = docSnap.data().subjects || [];
          renderSubjects();
        }
      } catch (e) {
        console.error("Data load error:", e);
      }
    }

    async function syncData() {
      if (!currentUser) return;
      try {
        await setDoc(doc(db, "users", currentUser.uid), { subjects: subjects });
      } catch (e) {
        console.error("Save error:", e);
      }
    }

    window.addSubject = () => {
      const nameInput = document.getElementById('sub-name');
      const attendedInput = document.getElementById('sub-attended');
      const totalInput = document.getElementById('sub-total');

      const name = nameInput.value.trim();
      const attended = parseInt(attendedInput.value) || 0;
      const total = parseInt(totalInput.value) || 0;

      if (!name) return alert("Subject ka naam daalo!");
      if (attended > total) return alert("Attended classes total se zyada nahi ho sakti!");

      subjects.push({ id: Date.now(), name, attended, total });
      nameInput.value = '';
      attendedInput.value = '';
      totalInput.value = '';

      renderSubjects();
      syncData();
    };

    window.updateAttendance = (id, deltaPresent, deltaTotal) => {
      subjects = subjects.map(sub => {
        if (sub.id === id) {
          const nextAttended = Math.max(0, sub.attended + deltaPresent);
          const nextTotal = Math.max(0, sub.total + deltaTotal);
          if (nextAttended <= nextTotal) {
            return { ...sub, attended: nextAttended, total: nextTotal };
          }
        }
        return sub;
      });
      renderSubjects();
      syncData();
    };

    window.deleteSubject = (id) => {
      subjects = subjects.filter(s => s.id !== id);
      renderSubjects();
      syncData();
    };

    function renderSubjects() {
      const container = document.getElementById('subjects-list');
      container.innerHTML = '';

      subjects.forEach(sub => {
        const pct = sub.total === 0 ? 0 : Math.round((sub.attended / sub.total) * 100);
        let statusMsg = '';
        let badgeColor = '';

        if (pct >= 75) {
          const bunksPossible = Math.floor((sub.attended - 0.75 * sub.total) / 0.75);
          statusMsg = bunksPossible > 0 
            ? `Chill zone! You can bunk ${bunksPossible} classes safely.` 
            : `Safe for now! Can't bunk any class right now.`;
          badgeColor = 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20';
        } else {
          const needed = Math.ceil((0.75 * sub.total - sub.attended) / 0.25);
          statusMsg = `Danger! Attend next ${needed} classes straight.`;
          badgeColor = 'text-rose-400 bg-rose-500/10 border-rose-500/20';
        }

        const card = document.createElement('div');
        card.className = 'glass-card p-5 rounded-2xl flex flex-col gap-4 border';
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h3 class="text-xl font-bold text-white">${sub.name}</h3>
              <p class="text-sm text-slate-400">Total: ${sub.attended}/${sub.total} Classes</p>
            </div>
            <div class="text-right">
              <span class="text-2xl font-black ${pct >= 75 ? 'text-emerald-400' : 'text-rose-400'}">${pct}%</span>
              <button onclick="deleteSubject(${sub.id})" class="block text-xs text-slate-500 hover:text-red-400 mt-1">Delete</button>
            </div>
          </div>
          <div class="px-3 py-2 rounded-lg text-xs font-medium border ${badgeColor}">
            ${statusMsg}
          </div>
          <div class="grid grid-cols-2 gap-2 mt-1">
            <button onclick="updateAttendance(${sub.id}, 1, 1)" class="bg-emerald-600/80 hover:bg-emerald-600 py-2.5 rounded-xl font-bold text-sm transition">+ Present</button>
            <button onclick="updateAttendance(${sub.id}, 0, 1)" class="bg-rose-600/80 hover:bg-rose-600 py-2.5 rounded-xl font-bold text-sm transition">+ Absent (Bunk)</button>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</head>
<body class="p-4 sm:p-6 flex flex-col items-center">
  <div class="w-full max-w-md flex flex-col gap-6">

    <!-- Header -->
    <header class="text-center pt-4">
      <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-violet-400 via-fuchsia-400 to-pink-400">
        BunkSafe 75%
      </h1>
      <p class="text-slate-400 text-xs mt-1 uppercase tracking-widest font-semibold">Attendance & Bunk Tracker</p>
      <div class="inline-block mt-2 px-3 py-0.5 rounded-full text-[11px] font-bold bg-violet-500/10 text-violet-300 border border-violet-500/20">
        Built by Yashh
      </div>
    </header>

    <!-- Auth Card -->
    <div id="auth-section" class="glass-card p-6 rounded-3xl flex flex-col gap-4 border">
      <h2 class="text-lg font-bold text-center text-slate-200">Cloud Sync Login</h2>
      <div class="space-y-3">
        <input id="auth-email" type="email" placeholder="Enter your college/personal email" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-violet-500">
        <input id="auth-password" type="password" placeholder="Password (min 6 characters)" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-violet-500">
      </div>
      <p id="auth-error" class="text-rose-400 text-xs font-semibold"></p>
      <button id="auth-submit-btn" onclick="handleAuth()" class="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:opacity-90 py-3 rounded-xl font-bold text-sm shadow-lg shadow-violet-600/30 transition">
        Sign Up
      </button>
      <div class="flex justify-between items-center text-xs text-slate-400 px-1">
        <span id="toggle-to-signup" class="hidden">New here? <button onclick="switchAuthMode('signup')" class="text-violet-400 font-bold underline">Sign Up</button></span>
        <span id="toggle-to-login">Have an account? <button onclick="switchAuthMode('login')" class="text-violet-400 font-bold underline">Login</button></span>
        <button onclick="handleResetPassword()" class="text-slate-400 hover:text-white underline">Forgot?</button>
      </div>
    </div>

    <!-- Main Tracker Section -->
    <div id="app-section" class="hidden flex flex-col gap-6">
      <div class="flex justify-between items-center bg-slate-900/40 px-4 py-2 rounded-xl border border-slate-800">
        <span id="user-badge" class="text-xs text-slate-400 truncate max-w-[200px]"></span>
        <button onclick="handleLogout()" class="text-xs text-rose-400 font-bold hover:underline">Logout</button>
      </div>

      <!-- Add Subject Card -->
      <div class="glass-card p-5 rounded-3xl border flex flex-col gap-3">
        <h3 class="text-sm font-bold text-slate-300">Add Subject</h3>
        <input id="sub-name" type="text" placeholder="e.g. C Programming, OS, Math" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-violet-500">
        <div class="grid grid-cols-2 gap-2">
          <input id="sub-attended" type="number" placeholder="Attended (e.g. 15)" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-violet-500">
          <input id="sub-total" type="number" placeholder="Total (e.g. 20)" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-violet-500">
        </div>
        <button onclick="addSubject()" class="w-full bg-violet-600 hover:bg-violet-500 py-2.5 rounded-xl font-bold text-sm transition">
          + Add Course
        </button>
      </div>

      <!-- Subjects Rendered Here -->
      <div id="subjects-list" class="flex flex-col gap-4"></div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-600 py-4">
      BunkSafe • Built by Yashh
    </footer>

  </div>
</body>
</html>
